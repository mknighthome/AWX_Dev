---
- name: Configure Cisco IOS VLAN and Description
  hosts: all
  gather_facts: false
  collections:
    - cisco.ios

  tasks:
    - name: Set interface description
      cisco.ios.ios_config:
        lines:
          - description Managed by Ansible AWX
        parents: interface Ethernet0/1

    - name: Save running configuration
      cisco.ios.ios_config:
        save_when: modified
