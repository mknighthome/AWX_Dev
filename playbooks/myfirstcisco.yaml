---
- name: cisco_sh_ver
  hosts: all
  gather_facts: false 
  tasks:
  - name: run show remote device
    cisco.ios.ios_command:
     commands: 
     - show run
     - show ver
    register: output
    
  - name: Display command output as a message
    ansible.builtin.debug:
      msg: "{{ output.stdout[0] }}"
